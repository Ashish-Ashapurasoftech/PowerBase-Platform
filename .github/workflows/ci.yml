name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PowerBase.sln

      - name: Build
        run: dotnet build PowerBase.sln --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test tests/PowerBase.UnitTests/PowerBase.UnitTests.csproj --no-build --configuration Release --logger trx

      - name: Integration Tests
        run: dotnet test tests/PowerBase.IntegrationTests/PowerBase.IntegrationTests.csproj --no-build --configuration Release --logger trx
